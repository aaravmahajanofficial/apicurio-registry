# Quarkus profile: webhooks-dev
# Activate from app/:  ../mvnw quarkus:dev -Dquarkus.profile=webhooks-dev
#
# Requires: docker compose -f examples/webhook-notifications/docker-compose-dev.yaml up -d

quarkus.log.category."io.apicurio".level=DEBUG

# PostgreSQL (matches examples/webhook-notifications/docker-compose-dev.yaml)
apicurio.storage.kind=sql
apicurio.storage.sql.kind=postgresql
apicurio.datasource.url=jdbc:postgresql://localhost:5432/registrydb
apicurio.datasource.username=pguser
apicurio.datasource.password=pgpass

# Enable artifact lifecycle operations for webhook event testing
apicurio.rest.deletion.group.enabled=true
apicurio.rest.deletion.artifact.enabled=true
apicurio.rest.deletion.artifact-version.enabled=true

# Auth: use embedded users (default) — admin user for /admin/webhooks when implemented
quarkus.oidc.tenant-enabled=false

# CORS for UI on :8888
quarkus.http.cors.origins=http://localhost:8889,http://127.0.0.1:8889,http://localhost:8888,http://127.0.0.1:8888

# Webhook settings (Phase 1+)
apicurio.features.experimental.enabled=true
apicurio.webhooks.enabled=true
apicurio.webhooks.allow-insecure-urls=true
apicurio.webhooks.security.block-private-ips=true
